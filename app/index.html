const EMU=new URLSearchParams(location.search).has("emu");
const app=initializeApp(EMU?{apiKey:"demo-key",authDomain:"demo-f40.firebaseapp.com",projectId:"demo-f40",appId:"demo"}:{apiKey:"AIzaSyCJwd0Kl_XaSE4T3k-3JjlsBXC-brNdFCY",authDomain:"thefirst40days-2656f.firebaseapp.com",projectId:"thefirst40days-2656f",storageBucket:"thefirst40days-2656f.firebasestorage.app",messagingSenderId:"361920828748",appId:"1:361920828748:web:4668b0834500a2cabaabe9"});

// ?emu=1 points the app at a local Firebase emulator (used by the automated tests only).
if(EMU){connectFirestoreEmulator(fs,"127.0.0.1",8080);connectAuthEmulator(auth,"http://127.0.0.1:9099",{disableWarnings:true})}
const wrapDoc=d=>({id:d.id,exists:d.exists(),data:()=>d.data(),metadata:d.metadata});
// Every read and write inside a family's circle goes under circles/<id>/ (set by setCircle).
let PREFIX="";
const mk=r=>({set:data=>setDoc(r,data),update:data=>updateDoc(r,data),delete:()=>deleteDoc(r),get:()=>getDoc(r).then(wrapDoc),
    onSnapshot:(next,err)=>onSnapshot(r,{includeMetadataChanges:false},d=>next(wrapDoc(d)),err)});

  doc:p=>mk(doc(fs,PREFIX+p)),

  setCircle:c=>{PREFIX=c?`circles/${c}/`:""},
  root:{doc:p=>mk(doc(fs,p))},
  newId:()=>doc(collection(fs,"circles")).id,
  async batch(ops){const b=writeBatch(fs);for(const[p,d]of ops){if(d===null)b.delete(doc(fs,p));else b.set(doc(fs,p),d)}return b.commit()}
};
const EMAIL_KEY="f40-email-for-link";
const authApi={
  current:()=>auth.currentUser,
  onChange:cb=>onIdTokenChanged(auth,cb),

  async google(){const p=new GoogleAuthProvider();const u=auth.currentUser;
    if(u&&u.isAnonymous){try{return await linkWithPopup(u,p)}catch(e){if(e.code==="auth/credential-already-in-use"||e.code==="auth/email-already-in-use")return signInWithPopup(auth,p);throw e}}
    return signInWithPopup(auth,p)},

  async finishLink(askEmail,pasted){const src=pasted||location.href;if(!isSignInWithEmailLink(auth,src))return false;let email="";try{email=localStorage.getItem(EMAIL_KEY)||""}catch(_){}
    if(!email)email=await askEmail();if(!email)return false;const href=src;if(!pasted)history.replaceState(null,"",location.pathname+location.hash);
    const u=auth.currentUser;
    if(u&&u.isAnonymous){try{await linkWithCredential(u,EmailAuthProvider.credentialWithLink(email,href))}catch(e){if(e.code==="auth/credential-already-in-use"||e.code==="auth/email-already-in-use")await signInWithEmailLink(auth,email,href);else throw e}}

<style>
:root{
  --bg:#FAF5EE; --card:#FFFFFF; --ink:#2D2622; --ink2:#4A403A; --muted:#857870; --line:#EDE4D9; --line2:#E2D6C8;
  --rose:#C2644E; --rose-d:#A9503C; --rose-s:#F7E4DD;
  --sage:#6C8C73; --sage-s:#E2ECE2;
  --honey:#C99532; --honey-s:#F8EDD3;
  --plum:#8C6B92; --plum-s:#EFE5F0;
  --sky:#5A82A0; --sky-s:#E2EBF2;
  --r:20px; --shadow:0 1px 2px rgba(60,40,30,.05),0 6px 24px rgba(60,40,30,.06);
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 10% -10%,#F6E1D6 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#E6EEE3 0,transparent 55%);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose-d)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.opt{color:var(--muted);font-weight:400;font-size:.85em}

/* header */
header.top{display:flex;align-items:center;gap:12px;padding:22px 0 10px}
.mark{width:44px;height:44px;border-radius:12px;background:url(mark-96.png?v=12) center/cover no-repeat;box-shadow:0 4px 14px rgba(194,100,78,.35);flex:none}
.brand h1{font-size:23px;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.brand{min-width:0;flex:1}
.syncbtn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:rgba(255,255,255,.85);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);box-shadow:var(--shadow)}
.syncbtn:hover{background:#fff;color:var(--rose-d)}
.syncbtn svg{width:18px;height:18px;color:var(--rose)}
@media(max-width:480px){.syncbtn span{display:none}.syncbtn{padding:10px}.brand h1{font-size:20px}}
.syncopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.syncopt:hover{border-color:var(--rose);background:#FFF8F5}
.syncopt .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.syncopt .si svg{width:24px;height:24px}
.syncopt b{display:block;font-size:16px}
.syncopt small{color:var(--muted);font-size:13px}
.seg.full{display:flex;margin-bottom:14px}.seg.full button{flex:1;padding:9px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,250,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;gap:2px;width:100%;max-width:560px}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:none;padding:7px 2px 5px;border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--rose-d);background:var(--rose-s)}
@media(min-width:820px){
  nav.tabs{position:sticky;top:0;bottom:auto;border:0;background:transparent;backdrop-filter:none;padding:6px 0 14px}
  nav.tabs .in{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:5px;max-width:none;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
  nav.tabs button{flex-direction:row;justify-content:center;font-size:14px;padding:9px 12px;border-radius:999px;gap:8px}
  nav.tabs button svg{width:19px;height:19px}
  .wrap{padding-bottom:60px}
}

/* cards & sections */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(237,228,217,.7);padding:20px}
section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 12px}
.sec-h h2{font-size:21px}
.sec-h .aside{color:var(--muted);font-size:14px}
.stack>*+*{margin-top:10px}
.banner{border-radius:16px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.banner.info{background:var(--sky-s);color:#2F4F66}
.banner.warn{background:var(--honey-s);color:#6B4E12}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:24px;background:linear-gradient(160deg,#fff 0,#FFF8F3 100%)}
.ring{position:relative;width:136px;height:136px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--serif);font-size:44px;line-height:1;font-weight:600}
.ring .num span{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}
.hero h2{font-size:24px;line-height:1.15}
.hero .sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.hero .welcome{margin:12px 0 0;font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:16px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.cta{justify-content:center}}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--rose);color:#fff;box-shadow:0 4px 14px rgba(194,100,78,.3)}
.btn.primary:hover{background:var(--rose-d)}
.btn.soft{background:var(--rose-s);color:var(--rose-d)}
.btn.sage{background:var(--sage-s);color:#3F5E46}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink2)}
.btn.ghost:hover{background:#FBF7F2}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn svg{width:16px;height:16px;flex:none}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.linkbtn{border:0;background:none;color:var(--rose-d);font-weight:600;padding:0;font-size:14px}

/* coverage grid */
.cov{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(min-width:600px){.cov{grid-template-columns:repeat(10,1fr)}}
.cell{aspect-ratio:1;border-radius:12px;background:#F7F1EA;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:13px;font-weight:600;color:var(--ink2);position:relative}
.cell:hover{border-color:var(--line2)}
.cell.past{opacity:.45}
.cell.today{background:#fff;border:2px solid var(--rose);color:var(--rose-d)}
.cell.full{background:var(--sage-s)}
.cell.some{background:#F3EFE4}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dot{width:6px;height:6px;border-radius:50%}
.dot.meal{background:var(--honey)}.dot.help{background:var(--sage)}.dot.need{background:#fff;box-shadow:inset 0 0 0 1.5px var(--rose)}
.cell .star{position:absolute;top:3px;right:4px;font-size:9px;color:var(--rose)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%}

/* rows */
.row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.row .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.row .rb{flex:1;min-width:0}
.row .rt{font-weight:600;font-size:15.5px;line-height:1.25}
.row .rm{color:var(--muted);font-size:13.5px;margin-top:2px}
.row .rn{font-size:13.5px;color:var(--ink2);margin-top:4px;background:#FAF6F1;border-radius:9px;padding:6px 9px}
.row .ra{flex:none;display:flex;gap:6px;align-items:center}
.row.open{border:1.5px dashed var(--line2);background:#FFFDFB}
.row.pri{border:1.5px solid #E7B4A6;background:linear-gradient(90deg,#FFF6F2,#fff)}
.row.pri.open{border-style:dashed}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.you{background:var(--rose-s);color:var(--rose-d);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;vertical-align:middle}
.badge.pri{background:var(--rose);color:#fff}
.badge.ok{background:var(--sage-s);color:#3F5E46}
.badge.open{background:var(--honey-s);color:#7A5714}
.c-honey .ico,.ci.c-honey{background:var(--honey-s)} .c-rose .ico{background:var(--rose-s)} .c-sage .ico{background:var(--sage-s)} .c-sky .ico{background:var(--sky-s)} .c-plum .ico{background:var(--plum-s)}
@media(max-width:480px){.row{padding:12px;gap:11px}.row .ico{width:38px;height:38px;font-size:19px}.row .ra .btn.sm{padding:7px 11px}}

/* day blocks */
.day{margin-top:22px}
.day-h{display:flex;align-items:center;gap:12px;margin:0 2px 10px}
.day-n{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.day-n small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.day-n b{font-family:var(--serif);font-size:19px;margin-top:2px}
.day.is-today .day-n{background:var(--rose);border-color:var(--rose);color:#fff}
.day.is-today .day-n small{color:#FBE0D8}
.day-h .dt{font-weight:600}
.day-h .dt span{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.day-h .sp{flex:1}
.empty{color:var(--muted);font-size:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px dashed var(--line2)}

/* calendar */
.seg{display:inline-flex;background:#F1E9DF;border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cal{padding:12px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
.cal-top h3{font-size:19px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow div{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding-bottom:4px}
.cc{min-height:74px;border-radius:12px;background:#FBF7F2;border:1.5px solid transparent;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;font-size:12px;overflow:hidden;position:relative}
.cc.out{background:transparent;opacity:.35;pointer-events:none}
.cc.past{opacity:.55}
.cc:hover{border-color:var(--line2)}
.cc.sel{border-color:var(--ink);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cc .cd{display:flex;align-items:baseline;justify-content:space-between;gap:2px}
.cc .cd b{font-size:14px;font-weight:700}
.cc .cd small{font-size:9.5px;color:var(--muted);font-weight:700}
.cc.today .cd b{background:var(--rose);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 5px}
.cc .mon{font-size:9.5px;font-weight:700;color:var(--rose-d);text-transform:uppercase;letter-spacing:.04em}
.pill{display:flex;align-items:center;gap:3px;border-radius:6px;padding:2px 4px;font-size:11px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pt{overflow:hidden;text-overflow:ellipsis}
.pill.honey{background:var(--honey-s);color:#6B4E12}.pill.rose{background:var(--rose-s);color:var(--rose-d)}.pill.sage{background:var(--sage-s);color:#3F5E46}.pill.sky{background:var(--sky-s);color:#2F4F66}.pill.plum{background:var(--plum-s);color:#5E4363}
.pill.open{background:#fff;box-shadow:inset 0 0 0 1.2px currentColor}
.pill.pri{background:var(--rose);color:#fff}
.more{font-size:10.5px;color:var(--muted);font-weight:700;padding-left:3px}
@media(max-width:640px){.cc{min-height:62px;padding:4px;gap:2px}.pill .pt{display:none}.pill{justify-content:center;padding:1px 0;font-size:11px}.cc .pills{display:grid;grid-template-columns:1fr 1fr;gap:2px}.cc .cd small{display:none}}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:12px 4px 2px}
.cal-legend span{display:inline-flex;gap:5px;align-items:center}
.cal-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* day bubble */
.pop{position:fixed;z-index:55;width:360px;max-height:70vh;overflow:auto;background:#FFFCF9;border-radius:22px;box-shadow:0 18px 50px rgba(45,38,34,.22),0 0 0 1px rgba(0,0,0,.04);padding:16px;display:none;animation:pop2 .18s ease}
.pop.show{display:block}
@keyframes pop2{from{opacity:0;transform:translateY(6px) scale(.98)}}
.pop-arrow{position:fixed;z-index:56;pointer-events:none;width:16px;height:16px;background:#FFFCF9;transform:rotate(45deg);display:none;box-shadow:-2px -2px 4px rgba(0,0,0,.04)}
.dm-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dm-h h3{font-size:19px;line-height:1.15}
.dm-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dm-h .x{margin-left:auto;width:30px;height:30px;font-size:18px}
.dm-sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.dm-line{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 9px;border-radius:11px;background:#F8F2EB;margin-bottom:5px}
.dm-line .tm{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.dm-open{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 7px 7px 10px;border-radius:12px;border:1.5px dashed var(--line2);margin-bottom:6px;background:#fff}
.dm-open.pri{border-color:#E7B4A6;background:#FFF6F2}
.dm-open .tx{flex:1;min-width:0}
.dm-open .tx b{display:block;font-weight:600;line-height:1.2}

.pp{display:block;cursor:pointer}.pp input{position:absolute;opacity:0;pointer-events:none}

<script>
/* ---------- constants (worded for each family: built from their settings) ---------- */
// Names come from the circle's settings: the mom, her partner and any older kids.
let mom="Mom",partner="",kid="",kidLabel="the kids";
const kidPoss=()=>kid?`${kid}’s`:"the kids’";
let CATS={},PREP={},PREP_INTRO={},FILTERS=[];
function buildText(){
  const st=S.settings||{};
  mom=(st.mom||"").trim()||"Mom";partner=(st.partner||"").trim();kid=(st.kid||"").trim();kidLabel=kid||"the kids";
  const us=partner?`${mom} or ${partner}`:mom;
  CATS={
    talulah:{label:`Time with ${kidLabel}`,icon:"🧸",color:"honey",hint:"Play, park, books, nap or bath help"},
    baby:{label:"Hold the baby",icon:"👶",color:"rose",hint:`So ${mom} can nap or shower`},
    laundry:{label:"Laundry",icon:"🧺",color:"sky",hint:"Wash, fold & put away"},
    cleaning:{label:"Tidy & clean",icon:"🧽",color:"sage",hint:"Dishes, kitchen, bathroom, floors"},
    cook:{label:"Cook a meal here",icon:"🍲",color:"honey",hint:"Make a meal in our kitchen"},

    night:{label:"Early or late help",icon:"🌙",color:"plum",hint:"Mornings, evenings, bedtime"},

  };
  if(!kid)delete CATS.talulah;
  PREP_INTRO={title:"Help Us Get Ready for Baby",text:st.prepIntro||`We’re getting the house, the freezer, and our family ready to welcome the baby. If you’d like to help, pick something that sounds like you${kid?`. An hour playing with ${kid}, a soup for the freezer, an extra pair of hands`:`. A soup for the freezer, an extra pair of hands`} or a little pampering for ${mom} would all make our lives a little sweeter right now.`};
  const all={
    lu:kid?{label:`Hang Out With ${kid}`,icon:"🧸",color:"honey",meta:["60–90 minutes","One helper",`Confirm plans with ${us}`],dur:90,start:"09:30",
      opts:[{k:"home",t:"Play at our house",d:`Hang out with ${kid} in a space we agree on while I get a few things done. Read books, do a little art project, build something, or have a dance party.`},
        {k:"adventure",t:`Take ${kid} on a little adventure`,d:"Go for a walk, visit the playground, or head to the library. We’ll agree on where you’re going and how you’ll get there ahead of time."},
        {k:"park",t:"Meet us at the park",d:`Come along and take the lead playing with ${kid} so I can get a little time to myself.`}],
      foot:`We’ll share ${kidPoss()} routine and have snacks ready.`,allergy:true}:null,
    clothes:{label:"Organize Baby Clothes & Make Room",icon:"👕",color:"sky",meta:["60–90 minutes","One or two helpers"],dur:90,start:"10:00",
      opts:[{k:"sort",t:"Sort baby clothes by size",d:"Fold and put away newborn and 0–3 month clothes so they’re easy to grab."},
        {k:"bins",t:"Label bins & pack away clothes",d:`Label bins for bigger sizes${kid?` and pack up the clothes ${kid} has outgrown`:""}.`},
        {k:"closet",t:"Swap seasonal clothes",d:"Help swap out seasonal clothes and make room in our closets."},
        {k:"shelves",t:"Clear shelves & drawers",d:"Clear and organize shelves and drawers. I’ll decide what goes where while you help sort, fold, and put things away."}]},
    birth:{label:"Nesting & Heavy Lifting",short:"Nesting & heavy lifting",icon:"📦",color:"sage",meta:["90 minutes","Two helpers"],dur:90,start:"10:00",
      opts:[{k:"down",t:"Bring things out of storage",d:"Bring down baby gear, newborn clothes, and anything else we need from storage."},
        {k:"up",t:"Pack things away",d:"Carry outgrown clothes, seasonal things, and anything we’re storing up to storage."},
        {k:"furniture",t:"Move furniture & clear space",d:`Help ${partner||"us"} move furniture or heavy bins and set up the baby’s space.`},
        {k:"supplies",t:"Set out linens & supplies",d:"Help set out towels, linens, and baby and postpartum supplies where we can easily find them."}]},
    freezer:{label:"Stock the Postpartum Freezer",short:"Postpartum freezer",icon:"🍲",color:"honey",meta:["30-minute drop-off window","or 90-minute batch-cooking shift"],dur:30,start:"17:00",dish:true,
      opts:[{k:"dropoff",t:"Drop off a freezer meal",d:"A family dinner, a few single portions, or something I can eat with one hand are all welcome. Porch drop-off is great.",dur:30},
        {k:"cook",t:"Come cook with me",d:"We’ll agree on a recipe and ingredients ahead of time. Help chop, cook, portion, label, and get the kitchen back in order.",dur:90},
        {k:"signature",t:"Make something you already love to cook",d:"If you make an incredible soup, stew, or breakfast burrito, tell me what it is. We’d love to try it.",dur:30}],
      ideas:[["Soups and stews",["Chicken, white bean, and kale soup","Beef and vegetable stew","Lentil, tomato, and spinach soup"]],
        ["Freezer dinners",["Turkey meatballs in tomato sauce with rice","Black bean and sweet potato enchiladas","Shredded chicken with roasted vegetables and quinoa"]],
        ["Breakfasts and one-handed snacks",["Egg and spinach breakfast burritos","Apple-cinnamon baked oatmeal","Turkey and veggie mini frittatas"]]],
      tip:"Think warming, filling, and easy to reheat. Meals with protein, a grain or starchy vegetable, and some produce are especially welcome. Beef, lentils, and beans are good options for iron-rich meals.",
      foot:"Please label the dish with its full ingredients, date, and reheating instructions. Check with us first about any food allergies.",allergy:true},
    yard:{label:partner?`Give ${partner} a Hand With the Yard`:"Help With the Yard",short:"Yard help",icon:"🍂",color:"sage",meta:["90–120 minutes","Two or three helpers"],dur:120,start:"10:00",
      opts:[{k:"leaves",t:"Rake leaves & haul debris",d:"Rake leaves, pick up sticks, and bag or haul yard debris."},
        {k:"walks",t:"Clear the walkways & entry",d:"Clear and sweep the walkways, steps, patio, and outdoor entry."},
        {k:"furniture",t:"Store outdoor furniture",d:"Help move or store outdoor furniture, planters, and seasonal items."}],
      foot:`If you’re handy outdoors, tell ${partner||"us"} what you like doing and there’ll be a few jobs ready when you arrive.`},
    mama:{label:"Pamper & Honor the Mama",short:"Pamper the mama",icon:"🌸",color:"rose",meta:["30–90 minutes","One helper","Before or after baby arrives"],dur:60,start:"14:00",
      opts:[{k:"home",t:"Pamper me at home",d:"Are you great at braiding hair? Do you give a wonderful neck or foot massage? Want to bring tea and sit with me? Yes, please.",dur:60},
        {k:"time",t:"Give me a little time to myself",d:`${kid?`Hang with ${kid} while I go to an appointment or take a walk. `:""}After baby arrives, you could hold her nearby while I take a shower or rest.`,dur:120},
        {k:"outside",t:"Get outside with me",d:"Come for a walk and some adult conversation.",dur:90},
        {k:"moment",t:"Help me mark the moment",d:"Bring flowers, write me a note to open after the birth, or share a small blessing with me over tea.",dur:30}]}
  };
  const off=st.prepOff||[];PREP={};for(const k in all)if(all[k]&&!off.includes(k))PREP[k]=all[k];
  FILTERS=[["all","Everything"],["open","Needs help"],["meals","Meals"],...(kid?[["talulah",kid]]:[]),["house","House help"],["care",`${mom} & baby`]];
}
const PREP_ALL_KEYS=[["lu","Time with the older kids"],["clothes","Baby clothes & making room"],["birth","Nesting & heavy lifting"],["freezer","Postpartum freezer"],["yard","Yard help"],["mama","Pamper the mama"]];
const PREP_NOTE={lbl:"What would you love to help with?",ph:"Pick an option above or tell us what you’re really good at. Maybe you’re a champion drawer organizer, make a legendary stew, love taking toddlers on little adventures, or know how to make someone feel cared for. If you have an idea we haven’t listed, we’d love to hear it."};
const catInfo=k=>CATS[k]||PREP[k]||(k==="talulah"?{label:"Time with the kids",icon:"🧸",color:"honey"}:CATS.other);
const prepOpt=i=>{const c=PREP[i.cat];return c&&(c.opts.find(o=>o.k===i.opt))};
const MEAL={icon:"🥘",color:"honey"};
const MEALTYPES={breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner"};
const FILTER_CATS={house:["laundry","cleaning","cook","serve","errands"],care:["baby","company","night"],talulah:["talulah"]};
const DEFAULTS={startDate:"",born:false,babyName:"",dueText:"",mom:"",partner:"",kid:"",family:"",address:"",welcome:"",prepOff:[],prepIntro:"",
  visitNotes:"Please wash your hands when you arrive.\nIf you're feeling even a little sick, please sit this one out.\nNo need to be entertained — help yourself to whatever you need.\nKeep visits gentle and short unless we ask you to stay.",
  talulahNotes:"",
  meals:{enabled:true,types:["dinner"],every:1,dropoff:"Between 4:30 and 6:00 pm",household:"",allergies:"",loves:"",avoid:"",instructions:"Leave it by the front door and send a text — no need to knock."}};
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"America/New_York"}catch(_){return"America/New_York"}})();
const FEED="https://raw.githubusercontent.com/thepatrickreardon-sys/Thefirst40days/main/feed/aR5SXx0iAMyxzaGMWc4VX44y.ics";
const fixCat=o=>{if(o&&o.cat==="tallulah")o.cat="talulah";return o};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());

function render(){

  renderTabs();renderBanners();
  $("#familyLine").textContent=S.settings.family||(S.circle&&S.circle.name)||"A circle of care";$("#footLine").textContent=`Made with love for ${mom} & family.`;

  const v={home:homeView,prep:prepView,schedule:scheduleView,meals:mealsView,mine:mineView,elena:elenaView}[S.tab]||homeView;

}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");if(!e.target.closest("#pop")&&!(a&&(a.dataset.act==="selday"||a.dataset.act==="mealday"||a.dataset.act==="myday"||a.dataset.act==="anotherday")))closePop();if(!a)return;const act=a.dataset.act;if(a.closest("#pop")&&act!=="closepop")closePop();
  if(act==="close"){closeSheet();return}
  if(act==="startsetup"){S.screen="setup";render();return}
  if(act==="golanding"){goLanding();return}
  if(act==="opencircle"){history.replaceState(null,"",location.pathname+location.search+"#c="+a.dataset.cid);route(true);return}
  if(act==="switchcircle"){goLanding();return}
  if(act==="copyinvite"){copyText(inviteUrl(),"Invite link copied");return}
  if(act==="shareinvite"){const url=inviteUrl();if(navigator.share){navigator.share({title:(S.circle&&S.circle.name)||"The First 40 Days",text:`Join ${mom}’s circle to help after the baby arrives:`,url}).catch(()=>{})}else copyText(url,"Invite link copied");return}
  if(act==="newinvite"){const code=randCode(24);try{await FB.db.doc("secrets/invite").set({code});S.invite=code;render();toast("New link made. The old one no longer works.")}catch(e){handleErr(e)}return}
  if(act==="togglemgr"){const u=a.dataset.uid;let m=[...(S.circle.managers||[])];m=m.includes(u)?m.filter(x=>x!==u):m.concat(u);try{await FB.db.root.doc("circles/"+S.cid).update({managers:m});toast("Updated")}catch(e){handleErr(e)}return}
  if(act==="rmmember"){const u=a.dataset.uid,n=(S.members[u]||{}).name||"this person";openSheet(sheetHead("Remove "+esc(n)+"?","Their sign-ups will be removed too.")+`<div class="calrow"><button class="btn primary" data-act="rmmembergo" data-uid="${esc(u)}">Remove</button><button class="btn ghost" data-act="close">Cancel</button></div>`);return}
  if(act==="rmmembergo"){const u=a.dataset.uid;try{let m=(S.circle.managers||[]).filter(x=>x!==u);if(m.length!==(S.circle.managers||[]).length)await FB.db.root.doc("circles/"+S.cid).update({managers:m});try{await FB.db.doc("people/"+u).delete()}catch(_){}await FB.db.doc("members/"+u).delete();closeSheet();toast("Removed")}catch(e){handleErr(e)}return}
  if(act==="askdelcircle"){openSheet(sheetHead("Delete this circle?","Everything goes: the schedule, every sign-up and every phone number. This can’t be undone.")+`<form novalidate data-form="delcircle" class="form"><div class="field"><label class="lbl">Type DELETE to confirm</label><input name="confirm" required autocomplete="off"></div><button class="btn primary block" type="submit" style="background:#B3261E">Delete forever</button></form>`);return}
  if(act==="askleave"){openSheet(sheetHead("Leave this circle?","Your sign-ups will be removed.")+`<div class="calrow"><button class="btn primary" data-act="leavego">Leave</button><button class="btn ghost" data-act="close">Cancel</button></div>`);return}
  if(act==="leavego"){closeSheet();try{await leaveCircle()}catch(e){handleErr(e)}return}
  if(act==="install"){installSheet();return}
  if(act==="hideinstall"){try{localStorage.setItem("f40-hide-install","1")}catch(_){}render();toast("You can still add it from My Shifts");return}
  if(act==="copylink"){copyText(SITE,"Link copied — paste it into Safari");return}
  if(act==="subbed"){try{localStorage.setItem("f40-sub","1")}catch(_){}setTimeout(render,1500);return}
  if(act==="resub"){try{localStorage.removeItem("f40-sub")}catch(_){}render();return}
  if(act==="acctsheet"){accountSheet();return}

  const u=S.authUser,{cid,code}=S.join;const name=String(fd.get("pname")||"").trim().slice(0,60);
  try{await FB.db.root.doc(`circles/${cid}/members/${u.uid}`).set({name,role:"helper",code,joinedAt:Date.now()})}
  catch(e){if(e&&e.code==="permission-denied"){toast("This invite link doesn't work anymore. Ask the family for a new one.",5000);return}throw e}
  lsSet(name);S.tab="home";openCircle(cid);toast(`Welcome, ${name} 💛`);
}
async function deleteCircle(){
  const cid=S.cid,uid=S.authUser.uid,db=FB.db;
  const ops=[];for(const p in S.people)ops.push(`circles/${cid}/people/${p}`);for(const p in S.contacts)ops.push(`circles/${cid}/contacts/${p}`);
  for(const n of S.needs)ops.push(`circles/${cid}/needs/${n.id}`);for(const m in S.members)if(m!==uid)ops.push(`circles/${cid}/members/${m}`);
  ops.push(`circles/${cid}/settings/main`,`circles/${cid}/secrets/invite`);
  circleSubs.forEach(u=>{try{u()}catch(_){}});circleSubs=[];
  for(let i=0;i<ops.length;i+=400)await db.batch(ops.slice(i,i+400).map(p=>[p,null]));
  await db.root.doc(`circles/${cid}`).delete();await db.root.doc(`circles/${cid}/members/${uid}`).delete();
  await rememberCircle(cid,true);goLanding();toast("Your circle and everything in it has been deleted.",4000);
}
async function leaveCircle(){
  const cid=S.cid,uid=S.authUser.uid,db=FB.db;
  try{await db.doc("people/"+uid).delete()}catch(_){}try{await db.doc("contacts/"+uid).delete()}catch(_){}
  await db.root.doc(`circles/${cid}/members/${uid}`).delete();await rememberCircle(cid,true);goLanding();toast("You've left the circle.");
}
function goLanding(){lsS("f40-circle","");history.replaceState(null,"",location.pathname+location.search);routedFor="";closeCircle();S.screen="landing";route(true)}

function screenView(){
  const sc=S.screen,u=S.authUser;
  if(sc==="checking"||!u)return`<div class="loading"><div class="spin"></div>Opening…</div>`;
  if(sc==="join")return`<section><div class="card" style="text-align:center;background:linear-gradient(160deg,#fff,#FFF5F0)"><div style="font-size:40px">💛</div><h2 style="margin:6px 0">You’re invited to help</h2>
    <p class="muted">A family you know is welcoming a new baby and has asked friends and family to pitch in with meals, visits and help around the house.</p></div></section>
    <section><div class="card"><form novalidate data-form="join" class="form"><div class="field"><label class="lbl">Your name</label><input name="pname" required maxlength="60" placeholder="e.g. Aunt Maria" value="${esc(lsGet())}"></div>
    <button class="btn primary block" type="submit">Join and see the schedule</button></form></div></section>`;
  if(sc==="noaccess")return`<section><div class="card" style="text-align:center"><div style="font-size:40px">🔒</div><h2 style="margin:6px 0">This circle is private</h2>
    <p class="muted">You need an invite link from the family to see it. Ask them to send it again.</p><button class="btn ghost" data-act="golanding">Go to the start page</button></div></section>`;
  if(sc==="setup"){
    if(u.isAnonymous)return`<section><div class="card"><h2>Start a circle</h2><p class="muted" style="margin:6px 0 14px">First, make an account so you never lose your circle. Use any email and pick a password.</p>${pwForm()}</div></section>`;
    return`<section><div class="card"><h2>Start a circle</h2><p class="muted" style="margin:6px 0 14px">A few details so the app can speak to your people. You can change all of this later.</p>
    <form novalidate data-form="newcircle" class="form">
     <div class="field"><label class="lbl">The new mom’s first name</label><input name="mom" required maxlength="40" placeholder="e.g. Ana"></div>
     <div class="two"><div class="field"><label class="lbl">Partner’s name <span class="opt">optional</span></label><input name="partner" maxlength="40"></div><div class="field"><label class="lbl">Older kids <span class="opt">optional</span></label><input name="kid" maxlength="40" placeholder="e.g. Lily"></div></div>
     <div class="two"><div class="field"><label class="lbl">Due date <span class="opt">or birthday</span></label><input type="date" name="startDate"></div><div class="field"><label class="lbl">How to say it <span class="opt">optional</span></label><input name="dueText" maxlength="60" placeholder="e.g. in early spring"></div></div>
     <div class="field"><label class="lbl">Food allergies <span class="opt">optional</span></label><input name="allergies" maxlength="300" placeholder="e.g. no peanuts"></div>
     <div class="field"><label class="lbl">Your name</label><input name="yourName" required maxlength="60" placeholder="So helpers know who set this up"></div>
     <button class="btn primary block" type="submit">Create the circle</button></form></div></section>`}
  // landing
  const mine=S.myCircles||[];
  return`<section><div class="card" style="text-align:center;background:linear-gradient(160deg,#fff,#FFF5F0);padding:28px 20px"><div class="mark" style="margin:0 auto 12px;width:64px;height:64px;border-radius:16px"></div>
    <h2 style="margin:0 0 8px">The First 40 Days</h2><p class="muted" style="margin:0 0 18px">Gather family and friends around a new mom: meals, visits, help with the older kids, and getting ready before baby comes. Everything in one private, shared schedule.</p>
    <button class="btn primary block" data-act="startsetup">Start a circle for a new mom</button></div></section>
   ${mine.length?`<section><div class="sec-h"><h2>Your circles</h2></div><div class="stack">${mine.map(c=>`<button class="row" style="text-align:left;width:100%" data-act="opencircle" data-cid="${esc(c.cid)}"><div class="rb"><div class="rt">${esc(c.name)}</div></div><span class="go">Open ›</span></button>`).join("")}</div></section>`:""}
   <section><div class="card"><b>Got an invite link?</b><p class="small muted" style="margin:4px 0 10px">Just tap the link the family sent you. Or paste it here:</p>
    <form novalidate data-form="pasteinvite" class="form" style="flex-direction:row;gap:8px"><div class="field" style="flex:1"><input name="link" required placeholder="Paste the invite link"></div><button class="btn ghost" type="submit">Open</button></form></div></section>`;
}
function circleAdminView(){
  const ownerUid=S.circle&&S.circle.ownerUid,mgr=(S.circle&&S.circle.managers)||[],me=S.authUser.uid;
  let h=`<section><div class="card"><div class="admin-h"><span class="n">4</span><h3>Invite people</h3></div>
   <p class="small muted" style="margin:-6px 0 10px">Send this link to family and friends. Anyone with it can join and sign up to help.</p>
   ${S.invite?`<div class="invite-box">${esc(inviteUrl())}</div><div class="calrow" style="margin-top:10px"><button class="btn primary sm" data-act="shareinvite">Share link</button><button class="btn ghost sm" data-act="copyinvite">Copy</button><button class="btn ghost sm" data-act="newinvite">Make a new link</button></div>
   <p class="small muted" style="margin:10px 0 0">A new link turns off the old one. People already in the circle stay in.</p>`:`<div class="small muted">Loading the link…</div>`}</div></section>`;
  const ms=Object.entries(S.members).sort((a,b)=>(a[1].role==="owner"?-1:0)-(b[1].role==="owner"?-1:0)||String(a[1].name).localeCompare(String(b[1].name)));
  h+=`<section><div class="card"><div class="admin-h"><span class="n">5</span><h3>People in this circle</h3></div>
   <p class="small muted" style="margin:-6px 0 10px">Managers can post requests, change these settings and see phone numbers. Helpers can sign up.</p><div class="stack">
   ${ms.map(([u,m])=>{const isOwner=m.role==="owner"||u===ownerUid,isMgr=mgr.includes(u);
     return`<div class="row" style="padding:10px 12px"><div class="rb"><div class="rt" style="font-size:14.5px">${esc((S.people[u]&&S.people[u].name)||m.name||"A helper")}${u===me?" (you)":""}</div><div class="rs">${isOwner?"Owner":isMgr?"Manager":"Helper"}</div></div>
     ${isOwner?"":`<div class="ra"><button class="btn ghost sm" data-act="togglemgr" data-uid="${u}">${isMgr?"Make helper":"Make manager"}</button>${u===me?"":`<button class="iconbtn" data-act="rmmember" data-uid="${u}" title="Remove from circle">✕</button>`}</div>`}</div>`}).join("")}</div></div></section>`;
  h+=`<section><div class="card"><div class="admin-h"><span class="n">6</span><h3>${me===ownerUid?"Delete this circle":"Leave this circle"}</h3></div>
   <p class="small muted" style="margin:-6px 0 10px">${me===ownerUid?"Permanently deletes the schedule, every sign-up and every phone number. This can’t be undone.":"You’ll stop managing this circle and need a new invite to come back."}</p>
   <button class="btn ghost sm" data-act="${me===ownerUid?"askdelcircle":"askleave"}" style="color:#B3261E">${me===ownerUid?"Delete circle…":"Leave circle…"}</button></div></section>`;
  return h;
}

/* ---------- boot ---------- */
async function refreshProfiles(){}
function askEmail(){return new Promise(res=>{openSheet(sheetHead("Confirm your email","For security, type the email you asked the link for.")+`<form novalidate data-form="confirmemail" class="form"><div class="field"><input name="email" type="email" required autocomplete="email"></div><button class="btn primary block" type="submit">Sign in</button></form>`);
  const f=$("#sheet form");f.addEventListener("submit",e=>{e.preventDefault();e.stopImmediatePropagation();res(String(new FormData(f).get("email")||"").trim());closeSheet()},{capture:true,once:true})})}
let subs=[];
function subscribeAdminData(){
  subs.forEach(u=>{try{u()}catch(_){}});subs=[];
  if(!S.isAdmin)return;
  subs.push(S.db.collection("contacts").onSnapshot(q=>{S.contacts=Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));render()},e=>console.warn(e)));
}
async function onUser(u){
  S.authUser=u;S.me={id:u?u.uid:null,name:(u&&u.displayName)||""};
  const pd=(u&&u.providerData)||[];
  const email=(u&&!u.isAnonymous&&(u.email||(pd.find(x=>x&&x.email)||{}).email)||"").toLowerCase();
  S.isAdmin=!!(u&&S.circle&&(S.circle.managers||[]).includes(u.uid));
  if(!S.isAdmin&&S.tab==="elena")S.tab="home";
  S.myContact="";if(u&&S.cid){S.db.doc("contacts/"+u.uid).get().then(d=>{S.myContact=(d.exists&&d.data().phone)||"";render()}).catch(()=>{})}
  subscribeAdminData();render();route();
}
function boot(){
  render();
  const go=()=>{
    S.db=FB.db;
    FB.auth.onChange(u=>{if(!u){FB.auth.guest().catch(e=>{console.warn(e);toast("Couldn't connect — check your connection.")});return}onUser(u)});
    FB.auth.finishLink(askEmail).then(async ok=>{if(ok){await onUser(FB.auth.current());toast("You're signed in 💛")}}).catch(e=>{console.warn(e);toast("That sign-in link didn't work — it may have expired. Try again.")});
    window.addEventListener("hashchange",()=>route());
  };
  if(window.FB)go();else window.addEventListener("fb-ready",go,{once:true});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
</script>
