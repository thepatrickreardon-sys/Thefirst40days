name: App tests
on:
  push:
    branches: [multi-family-v2]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Security rule tests
        working-directory: tests
        run: |
          npm i --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
          npx firebase emulators:exec --only firestore --project demo-f40 "node test.mjs"
