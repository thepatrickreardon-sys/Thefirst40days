name: Update calendar feed
on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_firestore.py /tmp/data.json
      - run: python3 build_ics.py /tmp/data.json
      - name: Commit if changed
        run: |
          git config user.name "First 40 Days bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed schedule.json
          git diff --cached --quiet || (git commit -m "Update calendar feed" && git push)
