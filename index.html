<script type="module">
// Backend adapter: exposes window.FB with a tiny db/auth API the app uses.
// Live mode talks to Firebase. Demo mode (?demo, or no Firebase config yet) keeps everything in memory.
import {FIREBASE_CONFIG} from "./config.js";
const qs=new URLSearchParams(location.search);
const DEMO=qs.has("demo")||!FIREBASE_CONFIG.apiKey;
if(DEMO){
  const {makeDemo}=await import("./demo.js");
  window.FB=makeDemo(qs.get("demo")==="helper");window.FB.demo=true;window.dispatchEvent(new Event("fb-ready"));
}else{
const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
const {getFirestore,doc,collection,setDoc,updateDoc,deleteDoc,onSnapshot,getDoc,getDocs,query,where}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
const {getAuth,onIdTokenChanged,signInAnonymously,GoogleAuthProvider,OAuthProvider,signInWithPopup,linkWithPopup,signOut,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,EmailAuthProvider,linkWithCredential,signInWithEmailAndPassword,createUserWithEmailAndPassword,updatePassword,sendPasswordResetEmail,sendEmailVerification,deleteUser}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
const app=initializeApp(FIREBASE_CONFIG);
const fs=getFirestore(app),auth=getAuth(app);
const wrapDoc=d=>({id:d.id,exists:d.exists(),data:()=>d.data(),metadata:d.metadata});
const wrapQ=q=>({docs:q.docs.map(wrapDoc),metadata:q.metadata});
const ref=p=>doc(fs,p);
const db={
  doc:p=>({set:data=>setDoc(ref(p),data),update:data=>updateDoc(ref(p),data),delete:()=>deleteDoc(ref(p)),get:()=>getDoc(ref(p)).then(wrapDoc),
    onSnapshot:(next,err)=>onSnapshot(ref(p),{includeMetadataChanges:false},d=>next(wrapDoc(d)),err)}),
  collection:p=>({onSnapshot:(next,err)=>onSnapshot(collection(fs,p),q=>next(wrapQ(q)),err),get:()=>getDocs(collection(fs,p)).then(wrapQ)}),
  // where(field, "array-contains", value)
  query:(p,field,val)=>({get:()=>getDocs(query(collection(fs,p),where(field,"array-contains",val))).then(wrapQ)})
};
const EMAIL_KEY="f40-email-for-link";
const here=()=>location.origin+location.pathname+location.search;
async function linkOrSignIn(p){const u=auth.currentUser;
  if(u&&u.isAnonymous){try{return await linkWithPopup(u,p)}catch(e){if(e.code==="auth/credential-already-in-use"||e.code==="auth/email-already-in-use")return signInWithPopup(auth,p);throw e}}
  return signInWithPopup(auth,p)}
const authApi={
  current:()=>auth.currentUser,
  onChange:cb=>onIdTokenChanged(auth,cb),
  guest:()=>signInAnonymously(auth),
  google:()=>linkOrSignIn(new GoogleAuthProvider()),
  apple:()=>{const p=new OAuthProvider("apple.com");p.addScope("email");p.addScope("name");return linkOrSignIn(p)},
  async sendLink(email){await sendSignInLinkToEmail(auth,email,{url:here(),handleCodeInApp:true});try{localStorage.setItem(EMAIL_KEY,email)}catch(_){}},
  async finishLink(askEmail,pasted){const src=pasted||location.href;if(!isSignInWithEmailLink(auth,src))return false;let email="";try{email=localStorage.getItem(EMAIL_KEY)||""}catch(_){}
    if(!email)email=await askEmail();if(!email)return false;const href=src;
    if(!pasted){const q=new URLSearchParams(location.search);["apiKey","oobCode","mode","lang","continueUrl"].forEach(k=>q.delete(k));history.replaceState(null,"",location.pathname+(q.toString()?"?"+q:"")+location.hash)}
    const u=auth.currentUser;
    if(u&&u.isAnonymous){try{await linkWithCredential(u,EmailAuthProvider.credentialWithLink(email,href))}catch(e){if(e.code==="auth/credential-already-in-use"||e.code==="auth/email-already-in-use")await signInWithEmailLink(auth,email,href);else throw e}}
    else await signInWithEmailLink(auth,email,href);
    try{localStorage.removeItem(EMAIL_KEY)}catch(_){}return true},
  async password(email,pw){
    try{await signInWithEmailAndPassword(auth,email,pw);return{created:false}}
    catch(e){if(!["auth/invalid-credential","auth/user-not-found","auth/wrong-password","auth/invalid-login-credentials"].includes(e.code))throw e}
    const u=auth.currentUser;
    try{if(u&&u.isAnonymous)await linkWithCredential(u,EmailAuthProvider.credential(email,pw));else await createUserWithEmailAndPassword(auth,email,pw);return{created:true}}
    catch(e){if(e.code==="auth/email-already-in-use"||e.code==="auth/credential-already-in-use"){const x=new Error("wrong password");x.code="f40/wrong-password";throw x}throw e}},
  setPassword:pw=>updatePassword(auth.currentUser,pw),
  reset:email=>sendPasswordResetEmail(auth,email),
  verify:()=>sendEmailVerification(auth.currentUser,{url:here()}),
  async reload(){const u=auth.currentUser;if(u){await u.reload();await u.getIdToken(true)}return auth.currentUser},
  deleteAccount:()=>deleteUser(auth.currentUser),
  signOut:()=>signOut(auth)
};
window.FB={db,auth:authApi};window.dispatchEvent(new Event("fb-ready"));
}
</script>

<style>
:root{
  --bg:#FAF5EE; --card:#FFFFFF; --ink:#2D2622; --ink2:#4A403A; --muted:#857870; --line:#EDE4D9; --line2:#E2D6C8;
  --rose:#C2644E; --rose-d:#A9503C; --rose-s:#F7E4DD;
  --sage:#6C8C73; --sage-s:#E2ECE2;
  --honey:#C99532; --honey-s:#F8EDD3;
  --plum:#8C6B92; --plum-s:#EFE5F0;
  --sky:#5A82A0; --sky-s:#E2EBF2;
  --r:20px; --shadow:0 1px 2px rgba(60,40,30,.05),0 6px 24px rgba(60,40,30,.06);
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body.landing nav.tabs,body.landing .syncbtn{display:none}
.brand a{color:inherit;text-decoration:none}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 10% -10%,#F6E1D6 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#E6EEE3 0,transparent 55%);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose-d)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.opt{color:var(--muted);font-weight:400;font-size:.85em}

/* header */
header.top{display:flex;align-items:center;gap:12px;padding:22px 0 10px}
.mark{width:44px;height:44px;border-radius:12px;background:url(mark-96.png?v=12) center/cover no-repeat;box-shadow:0 4px 14px rgba(194,100,78,.35);flex:none}
.brand h1{font-size:23px;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.brand{min-width:0;flex:1}
.syncbtn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:rgba(255,255,255,.85);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);box-shadow:var(--shadow)}
.syncbtn:hover{background:#fff;color:var(--rose-d)}
.syncbtn svg{width:18px;height:18px;color:var(--rose)}
@media(max-width:480px){.syncbtn span{display:none}.syncbtn{padding:10px}.brand h1{font-size:20px}}
.syncopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.syncopt:hover{border-color:var(--rose);background:#FFF8F5}
.syncopt .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.syncopt .si svg{width:24px;height:24px}
.syncopt b{display:block;font-size:16px}
.syncopt small{color:var(--muted);font-size:13px}
.seg.full{display:flex;margin-bottom:14px}.seg.full button{flex:1;padding:9px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,250,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;gap:2px;width:100%;max-width:560px}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:none;padding:7px 2px 5px;border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--rose-d);background:var(--rose-s)}
@media(min-width:820px){
  nav.tabs{position:sticky;top:0;bottom:auto;border:0;background:transparent;backdrop-filter:none;padding:6px 0 14px}
  nav.tabs .in{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:5px;max-width:none;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
  nav.tabs button{flex-direction:row;justify-content:center;font-size:14px;padding:9px 12px;border-radius:999px;gap:8px}
  nav.tabs button svg{width:19px;height:19px}
  .wrap{padding-bottom:60px}
}

/* cards & sections */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(237,228,217,.7);padding:20px}
section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 12px}
.sec-h h2{font-size:21px}
.sec-h .aside{color:var(--muted);font-size:14px}
.stack>*+*{margin-top:10px}
.banner{border-radius:16px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.banner.info{background:var(--sky-s);color:#2F4F66}
.banner.warn{background:var(--honey-s);color:#6B4E12}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:24px;background:linear-gradient(160deg,#fff 0,#FFF8F3 100%)}
.ring{position:relative;width:136px;height:136px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--serif);font-size:44px;line-height:1;font-weight:600}
.ring .num span{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}
.hero h2{font-size:24px;line-height:1.15}
.hero .sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.hero .welcome{margin:12px 0 0;font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:16px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.cta{justify-content:center}}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--rose);color:#fff;box-shadow:0 4px 14px rgba(194,100,78,.3)}
.btn.primary:hover{background:var(--rose-d)}
.btn.soft{background:var(--rose-s);color:var(--rose-d)}
.btn.sage{background:var(--sage-s);color:#3F5E46}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink2)}
.btn.ghost:hover{background:#FBF7F2}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn svg{width:16px;height:16px;flex:none}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.linkbtn{border:0;background:none;color:var(--rose-d);font-weight:600;padding:0;font-size:14px}

/* coverage grid */
.cov{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(min-width:600px){.cov{grid-template-columns:repeat(10,1fr)}}
.cell{aspect-ratio:1;border-radius:12px;background:#F7F1EA;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:13px;font-weight:600;color:var(--ink2);position:relative}
.cell:hover{border-color:var(--line2)}
.cell.past{opacity:.45}
.cell.today{background:#fff;border:2px solid var(--rose);color:var(--rose-d)}
.cell.full{background:var(--sage-s)}
.cell.some{background:#F3EFE4}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dot{width:6px;height:6px;border-radius:50%}
.dot.meal{background:var(--honey)}.dot.help{background:var(--sage)}.dot.need{background:#fff;box-shadow:inset 0 0 0 1.5px var(--rose)}
.cell .star{position:absolute;top:3px;right:4px;font-size:9px;color:var(--rose)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%}

/* rows */
.row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.row .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.row .rb{flex:1;min-width:0}
.row .rt{font-weight:600;font-size:15.5px;line-height:1.25}
.row .rm{color:var(--muted);font-size:13.5px;margin-top:2px}
.row .rn{font-size:13.5px;color:var(--ink2);margin-top:4px;background:#FAF6F1;border-radius:9px;padding:6px 9px}
.row .ra{flex:none;display:flex;gap:6px;align-items:center}
.row.open{border:1.5px dashed var(--line2);background:#FFFDFB}
.row.pri{border:1.5px solid #E7B4A6;background:linear-gradient(90deg,#FFF6F2,#fff)}
.row.pri.open{border-style:dashed}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.you{background:var(--rose-s);color:var(--rose-d);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;vertical-align:middle}
.badge.pri{background:var(--rose);color:#fff}
.badge.ok{background:var(--sage-s);color:#3F5E46}
.badge.open{background:var(--honey-s);color:#7A5714}
.c-honey .ico,.ci.c-honey{background:var(--honey-s)} .c-rose .ico{background:var(--rose-s)} .c-sage .ico{background:var(--sage-s)} .c-sky .ico{background:var(--sky-s)} .c-plum .ico{background:var(--plum-s)}
@media(max-width:480px){.row{padding:12px;gap:11px}.row .ico{width:38px;height:38px;font-size:19px}.row .ra .btn.sm{padding:7px 11px}}

/* day blocks */
.day{margin-top:22px}
.day-h{display:flex;align-items:center;gap:12px;margin:0 2px 10px}
.day-n{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.day-n small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.day-n b{font-family:var(--serif);font-size:19px;margin-top:2px}
.day.is-today .day-n{background:var(--rose);border-color:var(--rose);color:#fff}
.day.is-today .day-n small{color:#FBE0D8}
.day-h .dt{font-weight:600}
.day-h .dt span{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.day-h .sp{flex:1}
.empty{color:var(--muted);font-size:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px dashed var(--line2)}

/* calendar */
.seg{display:inline-flex;background:#F1E9DF;border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cal{padding:12px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
.cal-top h3{font-size:19px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow div{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding-bottom:4px}
.cc{min-height:74px;border-radius:12px;background:#FBF7F2;border:1.5px solid transparent;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;font-size:12px;overflow:hidden;position:relative}
.cc.out{background:transparent;opacity:.35;pointer-events:none}
.cc.past{opacity:.55}
.cc:hover{border-color:var(--line2)}
.cc.sel{border-color:var(--ink);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cc .cd{display:flex;align-items:baseline;justify-content:space-between;gap:2px}
.cc .cd b{font-size:14px;font-weight:700}
.cc .cd small{font-size:9.5px;color:var(--muted);font-weight:700}
.cc.today .cd b{background:var(--rose);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 5px}
.cc .mon{font-size:9.5px;font-weight:700;color:var(--rose-d);text-transform:uppercase;letter-spacing:.04em}
.pill{display:flex;align-items:center;gap:3px;border-radius:6px;padding:2px 4px;font-size:11px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pt{overflow:hidden;text-overflow:ellipsis}
.pill.honey{background:var(--honey-s);color:#6B4E12}.pill.rose{background:var(--rose-s);color:var(--rose-d)}.pill.sage{background:var(--sage-s);color:#3F5E46}.pill.sky{background:var(--sky-s);color:#2F4F66}.pill.plum{background:var(--plum-s);color:#5E4363}
.pill.open{background:#fff;box-shadow:inset 0 0 0 1.2px currentColor}
.pill.pri{background:var(--rose);color:#fff}
.more{font-size:10.5px;color:var(--muted);font-weight:700;padding-left:3px}
@media(max-width:640px){.cc{min-height:62px;padding:4px;gap:2px}.pill .pt{display:none}.pill{justify-content:center;padding:1px 0;font-size:11px}.cc .pills{display:grid;grid-template-columns:1fr 1fr;gap:2px}.cc .cd small{display:none}}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:12px 4px 2px}
.cal-legend span{display:inline-flex;gap:5px;align-items:center}
.cal-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* day bubble */
.pop{position:fixed;z-index:55;width:360px;max-height:70vh;overflow:auto;background:#FFFCF9;border-radius:22px;box-shadow:0 18px 50px rgba(45,38,34,.22),0 0 0 1px rgba(0,0,0,.04);padding:16px;display:none;animation:pop2 .18s ease}
.pop.show{display:block}
@keyframes pop2{from{opacity:0;transform:translateY(6px) scale(.98)}}
.pop-arrow{position:fixed;z-index:56;pointer-events:none;width:16px;height:16px;background:#FFFCF9;transform:rotate(45deg);display:none;box-shadow:-2px -2px 4px rgba(0,0,0,.04)}
.dm-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dm-h h3{font-size:19px;line-height:1.15}
.dm-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dm-h .x{margin-left:auto;width:30px;height:30px;font-size:18px}
.dm-sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.dm-line{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 9px;border-radius:11px;background:#F8F2EB;margin-bottom:5px}
.dm-line .tm{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.dm-open{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 7px 7px 10px;border-radius:12px;border:1.5px dashed var(--line2);margin-bottom:6px;background:#fff}
.dm-open.pri{border-color:#E7B4A6;background:#FFF6F2}
.dm-open .tx{flex:1;min-width:0}
.dm-open .tx b{display:block;font-weight:600;line-height:1.2}
.dm-open .tx span{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.15;transition:transform .08s,border .12s,background .12s}
.tile:hover{border-color:var(--rose);background:#FFF6F2}
.tile:active{transform:scale(.96)}
.tile .ti{font-size:22px}
.tile.meal{background:var(--honey-s);border-color:#EED9A8}
.dm-foot{margin-top:12px;text-align:center}

.cc.nomeal{background:transparent;border:1px dashed var(--line)}
.cc.mfull{background:#EEF4EC}
.cc .nm{font-size:10.5px;color:#BBAea2;margin-top:auto}
@media(max-width:640px){.mcal .pill .pt{display:inline;font-size:10px}.mcal .cc .pills{display:flex;flex-direction:column}.mcal .pill{justify-content:flex-start;padding:2px 3px}.mcal .pill .pe{display:none}.mcal .pill.honey{justify-content:center;font-size:15px;background:none}.mcal .pill.honey .pe{display:inline}.mcal .pill.honey .pt{display:none}.cal-top{flex-wrap:wrap;gap:2px}.cal-top h3{font-size:16px}}

.cc.mine{background:#fff;border-color:var(--rose)}
.cc.mine.sel{border-color:var(--ink)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* meals */
.mealstat{display:flex;align-items:center;gap:16px}
.mealstat b{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1}
.bar{height:10px;background:#F1E9DF;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--honey),#DDB25A);border-radius:99px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:560px){.notes{grid-template-columns:1fr}}
.note{background:#FBF7F2;border-radius:14px;padding:11px 13px}
.note h4{margin:0 0 3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note p{margin:0;font-size:14.5px;white-space:pre-wrap}
.note.alert{background:var(--rose-s)} .note.alert h4{color:var(--rose-d)}
.dish{display:inline-block;background:var(--honey-s);color:#6B4E12;border-radius:999px;padding:5px 11px;font-size:13.5px;margin:0 6px 6px 0;font-weight:500}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line2);background:#fff;border-radius:13px;padding:11px 13px;font-size:16px;outline:none;transition:border .15s,box-shadow .15s}
.field textarea{resize:vertical;min-height:70px}
.field input.err{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-s);background:#FFF8F5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-s)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:460px){.two{grid-template-columns:1fr}}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.catgrid{grid-template-columns:repeat(3,1fr)}}
.catopt{position:relative;border:1.5px solid var(--line);border-radius:15px;padding:11px;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:#fff;transition:border .12s,background .12s}
.catopt input{position:absolute;opacity:0;pointer-events:none}
.catopt .ci{font-size:22px}
.catopt .cl{font-weight:600;font-size:14px;line-height:1.2;margin-top:3px}
.catopt .ch{font-size:12px;color:var(--muted);line-height:1.25}
.catopt:has(input:checked){border-color:var(--rose);background:#FFF6F2;box-shadow:0 0 0 3px var(--rose-s)}
.durs{display:flex;flex-wrap:wrap;gap:7px}
.durs label{cursor:pointer}
.durs input{position:absolute;opacity:0;pointer-events:none}
.durs span{display:inline-block;border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;background:#fff}
.durs input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#FBF7F2;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--rose)}
.toggle b{display:block;font-size:15px}
.toggle small{color:var(--muted);font-size:13px}
.toggle.pri{background:var(--rose-s)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.signed{font-size:14px;color:var(--muted);background:#FBF7F2;border-radius:12px;padding:10px 12px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(45,38,34,.38);animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#FFFCF9;border-radius:26px 26px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:#E3D8CB;margin:4px auto 12px}
@media(min-width:700px){.sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:600px;border-radius:26px;max-height:88vh;padding:22px 26px 26px;animation:pop .22s ease}.sheet::before{display:none}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-h h3{font-size:23px}
.sheet-h p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.x{border:0;background:#F3ECE4;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink2);flex:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-48%) scale(.97);opacity:0}}
@keyframes fade{from{opacity:0}}
.success{text-align:center;padding:10px 0 4px}
.success .big{font-size:46px}
.calrow{display:flex;gap:8px;flex-wrap:wrap}
.calrow.center{justify-content:center}
.calbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none}
.calbtn:hover{background:#FBF7F2}
.calbtn svg{width:16px;height:16px}

/* toast */
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


.tips{margin:0;padding:0;list-style:none}
.tips li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.tips li:last-child{border:0}
.tips li span{flex:none}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mt{margin-top:12px}
.loading{padding:50px 0;text-align:center;color:var(--muted)}

.admin-h .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--rose-s);color:var(--rose-d);font-weight:700;font-size:14px}
.iconbtn{border:1px solid var(--line2);background:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--ink2)}
.iconbtn.on{background:var(--rose);border-color:var(--rose);color:#fff}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;font-family:var(--serif);font-style:italic}
.prep-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.prep-h .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.prep-h h2{font-size:20px;line-height:1.2;margin:0}
.prep-meta{font-size:13px;color:var(--muted);margin-top:4px}
.prep-opts{display:flex;flex-direction:column;gap:8px}
.prep-opt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;font-size:14.5px;line-height:1.45;color:var(--ink2);position:relative}
.prep-opt b{color:var(--ink)}
.prep-opt .go{display:block;margin-top:6px;font-weight:600;font-size:13px;color:var(--rose-d)}
.prep-opt:active{background:#FFF6F2}
.prep-jump{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ideas{margin-top:14px;background:#FBF7F2;border-radius:14px;padding:12px 13px}
.ideas h4{margin:0 0 8px;font-size:15px}
.idea-g{margin-bottom:6px}.idea-g small{display:block;font-weight:600;color:var(--muted);margin-bottom:5px}
.prep-who{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.prep-who small{font-weight:600;color:var(--muted)}
.prep-pick{display:flex;flex-direction:column;gap:8px}
.pp{display:block;cursor:pointer}.pp input{position:absolute;opacity:0;pointer-events:none}
.pp span{display:block;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.pp span b{display:block;font-size:14.5px}.pp span small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.pp:has(input:checked) span{border-color:var(--rose);background:#FFF6F2;box-shadow:0 0 0 3px var(--rose-s)}
.idea-chips{margin-top:8px}.idea-chips .dish{border:0;cursor:pointer;font:inherit;font-size:13px}
.namechips{display:flex;flex-wrap:wrap}.namechips .dish{border:0;cursor:pointer;font:inherit;font-size:14px}
.other-ways{margin-top:14px}.other-ways summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--rose-d)}
.subcard{padding:14px 16px;background:linear-gradient(160deg,#fff,#F3F7F1);border-color:#D8E5D6}.subcard.ok{background:var(--sage-s)}.calbtn.sub{font-weight:700}
.arrow-hint{text-align:center;font-size:34px;color:var(--rose);margin-top:8px;animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(8px)}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="mark" role="img" aria-label="The First 40 Days"></div>
    <div class="brand"><h1><a href="./" data-act="landing">The First 40 Days</a></h1><p id="familyLine">A circle of care for the first 40 days</p></div>
    <button class="syncbtn" data-act="sync" aria-label="Sync to your calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15.5l2 2 4-4"/></svg><span>Sync calendar</span></button>
  </header>
  <nav class="tabs"><div class="in" id="tabs"></div></nav>
  <div id="banners"></div>
  <main id="main"><div class="loading"><div class="spin"></div>Gathering the schedule…</div></main>
  <div class="foot" id="footLine">Made with love for new families.</div>
</div>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet-bg" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="pop-arrow" id="popArrow"></div><div class="pop" id="pop" role="dialog"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
// Wording is written once with placeholders and filled in from each family's settings:
// {mom} = the person being cared for, {kid} = older child(ren), {parents} = "Maya or Sam" / "Maya".
const CATS_T={
  kid:{label:"Time with {kid}",icon:"🧸",color:"honey",hint:"Play, park, books, nap or bath help",needsKid:true},
  baby:{label:"Hold the baby",icon:"👶",color:"rose",hint:"So {mom} can nap or shower"},
  laundry:{label:"Laundry",icon:"🧺",color:"sky",hint:"Wash, fold & put away"},
  cleaning:{label:"Tidy & clean",icon:"🧽",color:"sage",hint:"Dishes, kitchen, bathroom, floors"},
  cook:{label:"Cook a meal here",icon:"🍲",color:"honey",hint:"Make a meal in our kitchen"},
  serve:{label:"Serve a meal",icon:"🍽️",color:"rose",hint:"Plate it up & clean up after"},
  errands:{label:"Groceries & errands",icon:"🛒",color:"sky",hint:"Store runs, pharmacy, pickups"},
  company:{label:"Hang out",icon:"☕",color:"plum",hint:"Keep {mom} company — no hosting"},
  night:{label:"Early or late help",icon:"🌙",color:"plum",hint:"Mornings, evenings, bedtime"},
  other:{label:"Something else",icon:"✨",color:"sage",hint:"Tell us what you have in mind"}
};
/* ---------- getting ready (before baby) ---------- */
const PREP_INTRO_T={title:"Help Us Get Ready for Baby",text:"We’re getting our home and our family ready to welcome the new baby. If you’d like to help, pick something that sounds like you. {wishes} would all make our lives a little sweeter right now."};
const PREP_T={
  kidplay:{label:"Hang Out With {kid}",icon:"🧸",color:"honey",meta:["60–90 minutes","One helper","Confirm plans with {parents}"],dur:90,start:"09:30",needsKid:true,
    opts:[{k:"home",t:"Play at our house",d:"Keep {kid} company at home while we get a few things done. Books, art, building, dance parties: whatever they’re into that day."},
      {k:"adventure",t:"Take {kid} on a little outing",d:"A walk, the playground, or the library. We’ll agree on the plan ahead of time."},
      {k:"park",t:"Meet us at the park",d:"Come along and take the lead playing with {kid} so {mom} can have a little time to herself."}],
    foot:"We’ll fill you in on the routine and have snacks ready.",allergy:true},
  clothes:{label:"Sort & Organize",icon:"👕",color:"sky",meta:["60–90 minutes","One or two helpers"],dur:90,start:"10:00",
    opts:[{k:"sort",t:"Sort baby clothes",d:"Fold, sort by size, and put away the newborn things so they’re easy to grab."},
      {k:"bins",t:"Pack away & label",d:"Help pack up outgrown clothes and label bins."},
      {k:"closet",t:"Make some room",d:"Help clear out and rearrange a few spaces to make room for the new baby."},
      {k:"shelves",t:"General organizing",d:"An extra pair of hands to sort, fold, and put things away. We’ll decide what goes where."}]},
  setup:{label:"Heavy Lifting & Setting Up",short:"Heavy lifting & setup",icon:"📦",color:"sage",meta:["About 90 minutes","Two helpers"],dur:90,start:"10:00",
    opts:[{k:"down",t:"Bring things out of storage",d:"Help bring down the baby gear and supplies we’ve got stored away."},
      {k:"up",t:"Put things into storage",d:"Help carry outgrown and seasonal things up to storage."},
      {k:"furniture",t:"Move furniture",d:"Help move furniture and heavy bins and set up for the baby."},
      {k:"supplies",t:"Set up supplies",d:"Help set out linens and supplies so everything’s ready when we need it."}]},
  freezer:{label:"Stock the Postpartum Freezer",short:"Postpartum freezer",icon:"🍲",color:"honey",meta:["30-minute drop-off","or 90-minute cooking shift"],dur:30,start:"17:00",dish:true,
    opts:[{k:"dropoff",t:"Drop off a freezer meal",d:"A family dinner, a few single portions, or something easy to eat with one hand. Porch drop-off is great.",dur:30},
      {k:"cook",t:"Come cook with us",d:"We’ll agree on a recipe ahead of time, then cook, portion, label, and clean up together.",dur:90},
      {k:"signature",t:"Make your favorite",d:"Got a great soup, stew, or breakfast burrito? Tell us what it is. We’d love to try it.",dur:30}],
    ideas:[["Soups and stews",["Chicken, white bean, and kale soup","Beef and vegetable stew","Lentil, tomato, and spinach soup"]],
      ["Freezer dinners",["Turkey meatballs in tomato sauce with rice","Black bean and sweet potato enchiladas","Shredded chicken with roasted vegetables and quinoa"]],
      ["Breakfasts and one-handed snacks",["Egg and spinach breakfast burritos","Apple-cinnamon baked oatmeal","Turkey and veggie mini frittatas"]]],
    tip:"Think warming, filling, and easy to reheat. Meals with protein, a grain or starchy vegetable, and some veggies are especially welcome.",
    foot:"Please label the dish with its ingredients, the date, and how to reheat it. Check the allergy notes before you cook.",allergy:true},
  yard:{label:"Lend a Hand Outside",short:"Outdoor help",icon:"🍂",color:"sage",meta:["90–120 minutes","Two or three helpers"],dur:120,start:"10:00",
    opts:[{k:"leaves",t:"Yard cleanup",d:"Raking, picking up, and bagging or hauling debris."},
      {k:"walks",t:"Tidy the entry",d:"Sweep and clear the walkways and front entry."},
      {k:"furniture",t:"Put things away for the season",d:"Help move and store outdoor furniture and seasonal things."}],
    foot:"Handy outdoors? Tell us what you like doing and we’ll have a job ready."},
  mama:{label:"Pamper & Honor the Mama",short:"Pamper the mama",icon:"🌸",color:"rose",meta:["30–90 minutes","One helper","Before or after baby arrives"],dur:60,start:"14:00",
    opts:[{k:"home",t:"A little pampering",d:"Got a special skill like braiding or massage? Or just bring tea and sit with {mom} for a while.",dur:60},
      {k:"time",t:"Give {mom} some time to herself",d:"Cover things at home so she can get out for a bit, or after baby arrives, hold the baby so she can rest or shower.",dur:120},
      {k:"outside",t:"Get outside together",d:"Come for a walk and some grown-up conversation.",dur:90},
      {k:"moment",t:"Help mark the moment",d:"Flowers, a note to open after the birth, or a small blessing over tea.",dur:30}]}
};
const PREP_NOTE={lbl:"What would you love to help with?",ph:"Pick an option above or tell us what you’re really good at. Maybe you’re a champion drawer organizer, make a legendary stew, love taking little ones on adventures, or know how to make someone feel cared for. If you have an idea we haven’t listed, we’d love to hear it."};
let CATS={},PREP={},PREP_INTRO={},FILTERS=[];
let mom="Mom";
// Fill the wording in from this family's settings. Runs whenever settings change.
function applyFamily(){
  const st=S.settings;mom=(st.momName||"").trim()||"Mom";
  const kid=(st.kidName||"").trim(),partner=(st.partnerName||"").trim();
  const wish=`a meal for the freezer, an extra pair of hands, or a little pampering for ${mom}`;
  const V={mom,kid:kid||"the kids",parents:partner?`${mom} or ${partner}`:mom,wishes:kid?`Time with ${kid}, ${wish}`:wish[0].toUpperCase()+wish.slice(1)};
  const fill=s=>typeof s==="string"?s.replace(/\{(\w+)\}/g,(m,k)=>V[k]!==undefined?V[k]:m):s;
  const deep=o=>Array.isArray(o)?o.map(deep):(o&&typeof o==="object")?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,deep(v)])):fill(o);
  const keep=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>kid||!v.needsKid));
  CATS=deep(keep(CATS_T));PREP=deep(keep(PREP_T));PREP_INTRO=deep(PREP_INTRO_T);
  FILTERS=[["all","Everything"],["open","Needs help"],["meals","Meals"]].concat(kid?[["kid",kid]]:[]).concat([["house","House help"],["care",`${mom} & baby`]]);
}
const catInfo=k=>CATS[k]||PREP[k]||CATS.other||CATS_T.other;
const prepOpt=i=>{const c=PREP[i.cat];return c&&(c.opts.find(o=>o.k===i.opt))};
const MEAL={icon:"🥘",color:"honey"};
const MEALTYPES={breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner"};
const FILTER_CATS={house:["laundry","cleaning","cook","serve","errands"],care:["baby","company","night"],kid:["kid"]};
const DEFAULTS={startDate:"",born:false,babyName:"",dueText:"",momName:"",partnerName:"",kidName:"",family:"",address:"",welcome:"",
  visitNotes:"Please wash your hands when you arrive.\nIf you're feeling even a little sick, please sit this one out.\nNo need to be entertained — help yourself to whatever you need.\nKeep visits gentle and short unless we ask you to stay.",
  kidNotes:"",tz:"",
  meals:{enabled:true,types:["dinner"],every:1,dropoff:"Between 4:30 and 6:00 pm",household:"",allergies:"",loves:"",avoid:"",instructions:"Leave it by the front door and send a text — no need to knock."}};
const TZ=()=>S.settings.tz||Intl.DateTimeFormat().resolvedOptions().timeZone||"America/New_York";
const fixCat=o=>o;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const fmtDate=(s,o={weekday:"short",month:"short",day:"numeric"})=>parse(s).toLocaleDateString("en-US",o);

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  const lh=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,dt,2],[12,dd,2],[14,crc,4],[18,n,4],[22,n,4],[26,fn.length,2],[28,0,2]].forEach(([o,v,l])=>l===4?lh.setUint32(o,v,true):lh.setUint16(o,v,true));

function showBubble(html,anchor){
  if(window.innerWidth<700||!anchor){openSheet(html.replace('data-act="closepop"','data-act="close"'));return}
  closePop();const pop=$("#pop"),ar=$("#popArrow");pop.innerHTML=html;pop.classList.add("show");
  const r=anchor.getBoundingClientRect(),W=pop.offsetWidth,H=pop.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,gap=12;
  let left=Math.min(Math.max(12,r.left+r.width/2-W/2),vw-W-12),below=r.bottom+gap+H<vh-12||r.top-gap-H<12;
  let top=below?r.bottom+gap:r.top-gap-H;const want=top;top=Math.max(12,Math.min(top,vh-H-12));
  if(top!==want){ // doesn't fit above/below: sit beside the day instead
    const side=r.right+gap+W<vw-12?r.right+gap:r.left-gap-W;left=Math.max(12,side);top=Math.max(12,Math.min(r.top+r.height/2-H/2,vh-H-12));
    const rightSide=side>r.left;ar.style.display="block";ar.style.left=(rightSide?r.right+gap-7:r.left-gap-9)+"px";ar.style.top=(r.top+r.height/2-8)+"px";
    pop.style.left=left+"px";pop.style.top=top+"px";return}
  pop.style.left=left+"px";pop.style.top=top+"px";
  ar.style.display="block";ar.style.left=(r.left+r.width/2-8)+"px";ar.style.top=(below?r.bottom+gap-7:r.top-gap-9)+"px";
}

function prepSignups(k){const t=today();return allItems().filter(i=>i.kind==="prep"&&i.cat===k&&i.date>=t).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")))}
function prepCard(k){const c=PREP[k],st=S.settings,ups=prepSignups(k);
  let h=`<section><div class="card prep c-${c.color}"><div class="prep-h"><div class="ico">${c.icon}</div><div><h2>${esc(c.label)}</h2><div class="prep-meta">${c.meta.map(esc).join(" · ")}</div></div></div>
   <div class="prep-opts">${c.opts.map(o=>`<button class="prep-opt" data-act="prep" data-k="${k}" data-o="${o.k}"><b>${esc(o.t)}.</b> ${esc(o.d)}<span class="go">Sign up ›</span></button>`).join("")}</div>`;
  if(c.ideas)h+=`<div class="ideas"><h4>What you could bring</h4>${c.ideas.map(([g,xs])=>`<div class="idea-g"><small>${esc(g)}</small><div>${xs.map(x=>`<span class="dish">${esc(x)}</span>`).join("")}</div></div>`).join("")}<p class="small muted" style="margin:10px 0 0">${esc(c.tip)}</p></div>`;
  if(c.foot)h+=`<div class="note mt"><p>${esc(c.foot)}</p></div>`;
  if(c.allergy&&st.meals.allergies)h+=`<div class="note alert mt"><h4>⚠️ Food allergies</h4><p>${esc(st.meals.allergies)}</p></div>`;
  if(ups.length)h+=`<div class="prep-who"><small>Signed up</small>${ups.map(i=>`<div>${fmtDate(i.date)} · ${fmtTime(i.start)} · <span class="${i.uid===S.me.id?"you":"who"}">${esc(nameOf(i.uid))}</span> — ${esc(i.title||"")}${i.dish?` (${esc(i.dish)})`:""}</div>`).join("")}</div>`;
  h+=`<div style="margin-top:14px"><button class="btn primary block" data-act="prep" data-k="${k}">Sign up for this</button></div></div></section>`;
  return h}
function prepView(){
  let h=`<section><div class="card" style="background:linear-gradient(160deg,#fff,#FFF5F0)"><h2>${esc(PREP_INTRO.title)}</h2><p class="muted" style="margin:8px 0 14px">${esc(PREP_INTRO.text)}</p>
   <div class="prep-jump">${Object.entries(PREP).map(([k,c])=>`<button class="tile" data-act="prepjump" data-k="${k}"><span class="ti">${c.icon}</span>${esc(c.short||c.label)}</button>`).join("")}</div></div></section>`;
  for(const k in PREP)h+=`<div id="prep-${k}">${prepCard(k)}</div>`;
  h+=`<section><div class="card"><h3 style="margin:0 0 6px">Something else in mind?</h3><p class="small muted" style="margin:0 0 12px">${esc(PREP_NOTE.ph)}</p><button class="btn ghost block" data-act="prep" data-k="mama" data-o="" data-free="1">Tell us your idea</button></div></section>`;

function prepSheet(k,o,free){
  if(!guardWrite())return;const c=PREP[k];if(!c)return;const st=S.settings;

   ${free?`<input type="hidden" name="opt" value="idea">`:`<div class="prep-pick">${c.opts.map(x=>`<label class="pp"><input type="radio" name="opt" value="${x.k}" data-dur="${x.dur||c.dur}" ${sel&&x.k===sel.k?"checked":""}><span><b>${esc(x.t)}</b><small>${esc(x.d)}</small></span></label>`).join("")}</div>`}
   ${c.dish&&!free?`<div class="field"><label class="lbl">What are you making? <span class="opt">optional</span></label><input name="dish" maxlength="80" placeholder="e.g. Beef and vegetable stew"><div class="idea-chips">${c.ideas.flatMap(g=>g[1]).map(x=>`<button type="button" class="dish" data-act="pickdish" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`:""}
   <div class="two"><div class="field"><label class="lbl">Day</label><input type="date" name="date" required min="${t}" value="${tm}"></div><div class="field"><label class="lbl">Start time</label>${timeSelect("start",c.start||"10:00")}</div></div>
   <div><label class="lbl">For how long?</label>${durChips("dur",(sel&&sel.dur)||c.dur)}</div>
   <div class="field"><label class="lbl">${esc(PREP_NOTE.lbl)} <span class="opt">${free?"":"optional"}</span></label><textarea name="note" rows="3" maxlength="500" ${free?"required":""} placeholder="${esc(free?PREP_NOTE.ph:"Anything we should know")}"></textarea></div>
   ${c.allergy&&st.meals.allergies&&!free?`<div class="note alert"><h4>⚠️ If you’re cooking or bringing snacks</h4><p>${esc(st.meals.allergies)}</p></div>`:""}
   ${nameFields()}
   <button class="btn primary block" type="submit">Sign me up</button></form>`)}
function render(){
  renderTabs();renderBanners();
  $("#familyLine").textContent=S.settings.family||(S.fid?`A circle of care for ${mom} & family`:"A circle of care for the first 40 days");$("#footLine").textContent=S.fid?`Made with love for ${mom} & family.`:"Made with love for new families.";
  document.body.classList.toggle("landing",!S.fid);
  if(!S.fid){$("#main").innerHTML=S.live?landingView():`<div class="loading"><div class="spin"></div>Loading…</div>`;return}
  if(S.missing){$("#main").innerHTML=`<section><div class="card"><h2>We couldn't find that page</h2><p class="muted">The link may be mistyped, or the family may have taken their page down. Ask whoever sent it for the link again.</p><div class="cta"><button class="btn ghost" data-act="landing">Go to the start</button></div></div></section>`;return}
  if(S.live&&!(S.loaded.s&&S.loaded.n&&S.loaded.p&&S.loaded.f)&&!S.stale){$("#main").innerHTML=`<div class="loading"><div class="spin"></div>Gathering the schedule…</div>`;return}
  if(S.live&&S.loaded.p)checkFeed();
  const v={home:homeView,prep:prepView,schedule:scheduleView,meals:mealsView,mine:mineView,manage:manageView}[S.tab]||homeView;
  $("#main").innerHTML=v();
}

function mealSheet(date,type){

   ${S.authUser&&S.authUser.isAnonymous?`<p class="small muted" style="margin:18px 0 6px">Want your sign-ups on your other phone or in the Home Screen app?</p><button class="btn soft sm" data-act="acctsheet">Save them with your email</button>`:""}

function copyText(txt,label){
  const done=()=>toast(label||"Copied");
  try{navigator.clipboard.writeText(txt).then(done,()=>showCopy(txt))}catch(e){showCopy(txt)}
}
function showCopy(txt){openSheet(sheetHead("Copy this","Select the text and copy it.")+`<div class="field"><textarea rows="8" readonly onclick="this.select()">${esc(txt)}</textarea></div>`)}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");if(!e.target.closest("#pop")&&!(a&&(a.dataset.act==="selday"||a.dataset.act==="mealday"||a.dataset.act==="myday"||a.dataset.act==="anotherday")))closePop();if(!a)return;const act=a.dataset.act;if(a.closest("#pop")&&act!=="closepop")closePop();
  if(act==="close"){closeSheet();return}
  if(act==="landing"){e.preventDefault();closeSheet();goLanding();return}
  if(act==="startfam"){if(S.authUser&&!S.authUser.isAnonymous)createSheet();else signInFirst();return}
  if(act==="apple"){try{await FB.auth.apple();await onUser(FB.auth.current());if(!S.pendingCreate)closeSheet();toast("Signed in")}catch(e){if(e&&e.code!=="auth/popup-closed-by-user")toast("Apple sign-in didn't finish ("+(e.code||"error")+"). Try email and password instead.",4500)}return}
  if(act==="share"){shareSheet(false);return}
  if(act==="sharenow"){try{await navigator.share({title:"The First 40 Days",text:shareText(),url:inviteLink()})}catch(_){}return}
  if(act==="copyinvite"){copyText(shareText()+" "+inviteLink(),"Link copied — paste it in a text or email");return}
  if(act==="delfam"){openSheet(sheetHead("Delete this page for good?","This can't be undone.")+`<p class="muted">Every request, sign-up and phone number on this page will be erased, and the link will stop working.</p><form novalidate data-form="delfam" class="form"><div class="field"><label class="lbl">Type DELETE to confirm</label><input name="confirm" required autocomplete="off"></div><button class="btn primary block" type="submit">Delete the page</button></form>`);return}

function authMsg(e){const c=e&&e.code||"";
  return({"f40/wrong-password":"That password doesn't match this email. Tap Forgot password to set a new one.","auth/weak-password":"Pick a password with at least 6 characters.","auth/invalid-email":"That email doesn't look right.","auth/too-many-requests":"Too many tries — wait a few minutes and try again.","auth/operation-not-allowed":"Password sign-in isn't available right now — try another way to sign in.","auth/requires-recent-login":"For safety, sign out and back in, then set your password.","auth/network-request-failed":"No connection — try again in a moment."})[c]||("That didn't work"+(c?" ("+c+")":"")+" — please try again.")}
function applyName(d,fd){if(fd.has("pname")){d.name=String(fd.get("pname")).trim().slice(0,60);lsSet(d.name);d.phone=String(fd.get("pphone")||"").trim().slice(0,30)}return d}
document.addEventListener("submit",async e=>{

    toast(bad.name==="pname"?"Please add your name first ✍️":bad.type==="email"?"Please enter a valid email":bad.type==="password"?"Password needs at least 6 characters":bad.name==="dish"?"Tell us what you're bringing":"Please fill in the highlighted box",3200);return}

    if(kind==="delfam"){if(String(fd.get("confirm")||"").trim().toUpperCase()!=="DELETE"){toast("Type DELETE to confirm");return}const fid=S.fid;
      try{await wipeFamily(fid);forget(fid);closeSheet();toast("Your page is deleted");goLanding()}catch(e){handleErr(e)}return}
    if(kind==="pastelink"){const l=String(fd.get("link")||"").trim();closeSheet();try{const ok=await FB.auth.finishLink(askEmail,l);if(!ok){toast("That doesn't look like the sign-in link — copy it from the email again.");return}await onUser(FB.auth.current());toast("You're signed in 💛");render()}catch(e){console.warn(e);toast("That link didn't work — it may have expired. Send a new one.")}return}

      try{const r=await FB.auth.password(em,pw);await onUser(FB.auth.current());closeSheet();
        if(r.created&&S.admins.includes(em.toLowerCase())){try{await FB.auth.verify()}catch(_){}}
        toast(r.created?"Account made — you're all set 💛":"You're signed in 💛",3500);render()}
      catch(e){toast(authMsg(e),5000)}return}
    if(kind==="setpw"){try{await FB.auth.setPassword(String(fd.get("pw")||""));f.reset();toast("Password saved — use it to sign in anywhere")}catch(e){toast(authMsg(e),5000)}return}
    if(kind==="sendlink"){const em=String(fd.get("email")||"").trim();await FB.auth.sendLink(em);openSheet(sheetHead("Check your email 📬",`We sent a sign-in link to <b>${esc(em)}</b>.`)+`<p class="muted">If you're in Safari, just tap the link in the email. If you're using the Home Screen icon, press and hold the link in the email, tap <b>Copy Link</b>, then come back here and tap <b>Paste link</b> under My Shifts. Not there in a minute? Check Junk.</p><button class="btn primary block" data-act="pastelink">Paste link</button><button class="btn ghost block" style="margin-top:8px" data-act="close">OK</button>`);return}
    if(kind==="admin"){const em=String(fd.get("email")||"").trim().toLowerCase();if(!em)return;await S.db.doc(P("admins/"+em)).set({addedAt:Date.now()});f.reset();toast("Added — they'll get the Manage tab after signing in with that email");return}
    if(kind==="help"){const item={id:uid(),kind:"help",cat:fd.get("cat")||"other",title:String(fd.get("title")||"").trim(),date:fd.get("date"),start:fd.get("start"),dur:+fd.get("dur")||60,note:String(fd.get("note")||"").trim(),at:Date.now()};
      await saveMine(d=>{applyName(d,fd);d.items.push(item);return d});successSheet(item)}
    else if(kind==="prep"){const k=fd.get("k"),c=PREP[k];const ok=String(fd.get("opt")||"");const o=c.opts.find(x=>x.k===ok);

    else if(kind==="claim"){const n=S.needs.find(x=>x.id===fd.get("id"));if(!n)throw 0;if(!isOpen(n)){toast("Someone just took that one — thank you anyway!");closeSheet();return}

      const from=fd.get("date"),until=fd.get("until"),rep=fd.get("repeat");let ds=[from];

const newFid=()=>{const b=crypto.getRandomValues(new Uint8Array(15));return btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_")};
const validFid=f=>!!f&&/^[A-Za-z0-9_-]{4,40}$/.test(f);
function recent(){try{return JSON.parse(localStorage.getItem("f40-recent")||"[]")}catch(_){return[]}}
function remember(fid,name){if(!fid||fid==="demo")return;try{const r=recent().filter(x=>x.f!==fid);r.unshift({f:fid,name:name||"",at:Date.now()});localStorage.setItem("f40-recent",JSON.stringify(r.slice(0,8)));localStorage.setItem("f40-last",fid)}catch(_){}}
function forget(fid){try{localStorage.setItem("f40-recent",JSON.stringify(recent().filter(x=>x.f!==fid)));if(localStorage.getItem("f40-last")===fid)localStorage.removeItem("f40-last")}catch(_){}}
function pickFid(){const q=new URLSearchParams(location.search);let f=q.get("f");
  if(!f&&q.has("demo"))f="demo";
  if(!f&&isStandalone())f=lsGet2("f40-last")||null; // a Home Screen launch can drop the ?f= link
  return validFid(f)?f:null}
function signedInEmail(u){const pd=(u&&u.providerData)||[];return(u&&!u.isAnonymous&&(u.email||(pd.find(x=>x&&x.email)||{}).email)||"").toLowerCase()}
async function loadMyFamilies(){const u=S.authUser;if(!u||u.isAnonymous||S.fid){S.myFamilies=null;return}

  else h+=`<p class="small muted" style="text-align:center;margin-top:18px">Started a page before? <button class="linkbtn" data-act="acctsheet">Sign in</button> to find it.</p>`;
  return h}
function signInFirst(){S.pendingCreate=true;openSheet(sheetHead("First, make your account","So you can come back and manage your page from any phone.")+
  `<div class="calrow" style="margin-bottom:14px"><button class="btn ghost" data-act="apple">${ICON_A} Sign in with Apple</button><button class="btn ghost" data-act="google">Google</button></div>`+pwForm())}
function createSheet(){S.pendingCreate=false;
  openSheet(sheetHead("Start your family's page","You can change any of this later.")+`<form novalidate data-form="createfam" class="form">
   <div class="two"><div class="field"><label class="lbl">New mom's first name</label><input name="momName" required maxlength="40" placeholder="e.g. Maya"></div>
   <div class="field"><label class="lbl">Partner <span class="opt">optional</span></label><input name="partnerName" maxlength="40" placeholder="e.g. Sam"></div></div>
   <div class="field"><label class="lbl">Big brothers or sisters <span class="opt">optional</span></label><input name="kidName" maxlength="60" placeholder="e.g. Theo, or Theo & Ava"><small class="small muted" style="display:block;margin-top:6px">Adds "Time with Theo" as a way to help.</small></div>
   <div class="field"><label class="lbl">Due date or birthday <span class="opt">optional</span></label><input type="date" name="startDate"></div>
   <label class="toggle"><input type="checkbox" name="born"><div><b>Baby has arrived</b><small>The 40 days count from the birthday</small></div></label>
   <div class="field"><label class="lbl">⚠️ Food allergies <span class="opt">optional</span></label><input name="allergies" maxlength="300" placeholder="e.g. no peanuts or tree nuts"></div>
   <p class="small muted" style="margin:0">By starting a page you agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.</p>
   <button class="btn primary block" type="submit">Create our page</button></form>`)}
async function createFamily(fd){
  const u=S.authUser;if(!u||u.isAnonymous){signInFirst();return}
  const t=k=>String(fd.get(k)||"").trim();const momName=t("momName"),partnerName=t("partnerName"),kidName=t("kidName");
  const fid=newFid();const name=[momName,partnerName].filter(Boolean).join(" & ");
  await S.db.doc("families/"+fid).set({name,ownerUids:[u.uid],createdAt:Date.now(),createdBy:u.uid});
  const st=merge(DEFAULTS,{momName,partnerName,kidName,startDate:t("startDate"),born:fd.has("born"),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||"",
    family:[momName,partnerName,kidName].filter(Boolean).join(" · ")+" · baby"});st.meals.allergies=t("allergies");
  await S.db.doc(`families/${fid}/settings/main`).set(st);
  remember(fid,name);history.pushState(null,"","?f="+encodeURIComponent(fid));S.justCreated=true;S.tab="manage";openFamily(fid);closeSheet();
  setTimeout(()=>shareSheet(true),400)}
function shareText(){return`We're using The First 40 Days to organize help after the baby comes. Sign up for a meal or a time to help here:`}
function shareSheet(first){const link=inviteLink();
  openSheet(sheetHead(first?"Your page is ready 💛":"Invite your people",first?"Send this link to the family and friends you'd like to help.":"Anyone with this link can see the schedule and sign up.")+
   `<div class="field"><input readonly value="${esc(link)}" onclick="this.select()"></div>
   <div class="calrow" style="margin-top:12px">${navigator.share?`<button class="btn primary" data-act="sharenow">Share the link</button>`:""}<button class="btn ${navigator.share?"ghost":"primary"}" data-act="copyinvite">Copy the link</button></div>
   <p class="small muted" style="margin-top:14px">Only share it with people you trust: the link shows your schedule and the address you add. Phone numbers stay private to you.</p>`)}
function shareCard(){return`<section><div class="card subcard" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="font-size:28px">🔗</div><div style="flex:1;min-width:200px"><b>Invite your people</b><div class="small muted">Send your page's link by text, email or the family group chat.</div></div><button class="btn primary sm" data-act="share">Share link</button></div></section>`}
function dangerCard(){if(!S.isOwner)return"";return`<section><div class="card"><div class="admin-h"><h3>Delete this page</h3></div><p class="small muted" style="margin:-6px 0 12px">Removes the schedule, every sign-up and all phone numbers for good. Helpers' links stop working.</p><button class="btn ghost" data-act="delfam">Delete this family page</button></div></section>`}
async function wipeFamily(fid){for(const c of["needs","people","contacts","admins","settings"]){const q=await S.db.collection(`families/${fid}/${c}`).get();for(const d of q.docs)await S.db.doc(`families/${fid}/${c}/${d.id}`).delete()}await S.db.doc("families/"+fid).delete()}
async function removeMeFromFamily(){if(!S.fid||!S.me.id)return;try{await S.db.doc(P("people/"+S.me.id)).delete()}catch(e){console.warn(e)}try{await S.db.doc(P("contacts/"+S.me.id)).delete()}catch(e){console.warn(e)}}
function goLanding(push=true){famSubs.forEach(f=>{try{f()}catch(_){}});famSubs=[];S.fid=null;S.family=null;S.isAdmin=S.isOwner=false;if(push)history.pushState(null,"",location.pathname);S.tab="home";render();loadMyFamilies()}

/* ---------- boot ---------- */
async function refreshProfiles(){}
function askEmail(){return new Promise(res=>{openSheet(sheetHead("Confirm your email","For security, type the email you asked the link for.")+`<form novalidate data-form="confirmemail" class="form"><div class="field"><input name="email" type="email" required autocomplete="email"></div><button class="btn primary block" type="submit">Sign in</button></form>`);
  const f=$("#sheet form");f.addEventListener("submit",e=>{e.preventDefault();e.stopImmediatePropagation();res(String(new FormData(f).get("email")||"").trim());closeSheet()},{capture:true,once:true})})}
let subs=[],famSubs=[];
// Co-managers: owners see the whole list; everyone else just checks their own email.
async function checkAdmin(){const u=S.authUser,em=signedInEmail(u);if(!S.fid||!em||S.isOwner)return;
  try{const d=await S.db.doc(P("admins/"+em)).get();if(d.exists&&!S.admins.includes(em)){S.admins=S.admins.concat([em]);S.isAdmin=true;subscribeAdminData();render()}}catch(_){}}
function subscribeAdminData(){
  subs.forEach(u=>{try{u()}catch(_){}});subs=[];
  if(!S.isAdmin||!S.fid)return;
  subs.push(S.db.collection(P("admins")).onSnapshot(q=>{S.admins=q.docs.map(d=>d.id.toLowerCase());render()},()=>{}));
  subs.push(S.db.collection(P("contacts")).onSnapshot(q=>{S.contacts=Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));render()},e=>console.warn(e)));
}
async function onUser(u){
  const changed=(S.authUser&&S.authUser.uid)!==(u&&u.uid);
  S.authUser=u;S.me={id:u?u.uid:null,name:(u&&u.displayName)||""};
  const email=signedInEmail(u);
  S.isOwner=!!(u&&S.family&&(S.family.ownerUids||[]).includes(u.uid));
  S.isAdmin=S.isOwner||(!!email&&S.admins.includes(email));
  if(!S.isAdmin&&S.tab==="manage")S.tab="home";
  if(S.fid&&u&&(changed||!famSubs.length))openFamily(S.fid);
  S.myContact="";if(u&&S.fid){S.db.doc(P("contacts/"+u.uid)).get().then(d=>{S.myContact=(d.exists&&d.data().phone)||"";render()}).catch(()=>{})}
  subscribeAdminData();checkAdmin();
  if(!S.fid&&changed)loadMyFamilies();
  if(S.pendingCreate&&u&&!u.isAnonymous){S.pendingCreate=false;setTimeout(createSheet,80)}
  render();
}
function openFamily(fid){
  famSubs.forEach(f=>{try{f()}catch(_){}});famSubs=[];
  const db=S.db;S.fid=fid;S.live=true;S.missing=false;S.stale=false;S.loaded={s:false,n:false,p:false,f:false};
  S.settings=clone(DEFAULTS);S.needs=[];S.people={};S.admins=[];S.contacts={};applyFamily();
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  const done=k=>{S.loaded[k]=true;if(S.loaded.s&&S.loaded.n&&S.loaded.p&&S.loaded.f){clearTimeout(timer);S.stale=false}render()};
  const fail=e=>{console.warn(e);clearTimeout(timer);if(e&&e.code==="permission-denied"&&!S.family)S.missing=true;else S.stale=true;S.loaded={s:true,n:true,p:true,f:true};render()};
  famSubs.push(db.doc("families/"+fid).onSnapshot(d=>{if(!d.exists){clearTimeout(timer);S.missing=true;S.family=null;render();return}
    S.family=d.data();remember(fid,S.family.name);done("f");if(S.authUser){const was=S.isAdmin;S.isOwner=(S.family.ownerUids||[]).includes(S.authUser.uid);S.isAdmin=S.isOwner||S.admins.includes(signedInEmail(S.authUser));if(was!==S.isAdmin)subscribeAdminData();checkAdmin();render()}},fail));
  famSubs.push(db.doc(P("settings/main")).onSnapshot(s=>{S.settings=merge(DEFAULTS,s.exists?s.data():{});applyFamily();done("s")},fail));
  famSubs.push(db.collection(P("needs")).onSnapshot(q=>{S.needs=q.docs.map(d=>({...d.data(),id:d.id}));done("n")},fail));
  famSubs.push(db.collection(P("people")).onSnapshot(q=>{S.people=Object.fromEntries(q.docs.map(d=>[d.id,clone(d.data())]));done("p")},fail));
}
function boot(){
  applyFamily();render();
  const go=()=>{
    S.db=FB.db;S.fid=pickFid();if(!S.fid)S.live=true;
    FB.auth.onChange(u=>{if(!u){FB.auth.guest().catch(e=>{console.warn(e);toast("Couldn't connect — check your connection.")});return}onUser(u)});
    FB.auth.finishLink(askEmail).then(async ok=>{if(ok){await onUser(FB.auth.current());toast("You're signed in 💛");if(S.fid)S.tab="mine";render()}}).catch(e=>{console.warn(e);toast("That sign-in link didn't work — it may have expired. Try again.")});
  };
  if(window.FB)go();else window.addEventListener("fb-ready",go,{once:true});
  window.addEventListener("popstate",()=>{const f=pickFid();if(f!==S.fid){if(f)openFamily(f);else goLanding(false)}});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
</script>
</body>
